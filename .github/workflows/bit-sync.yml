# Reconcile: it keeps each bit.cloud lane and its git branch equal, and it
# opens the main-sync pull request when the main scope moves ahead of git.
name: bit-sync
on:
  # The bit.cloud webhook sends this event after every export.
  # `client_payload.laneId` names the lane. An empty value means a main export.
  repository_dispatch:
    types: [bit-export]
  push:
    # Pushes to these branches are the action's own output.
    # They must not start a new sync.
    branches-ignore: [main, 'bit-sync/**']
  schedule:
    # The reconcile repairs a lost webhook delivery.
    # It is also the only way to find a deleted lane.
    # bit.cloud has no lane-removed event.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      lane:
        description: Lane to sync. An empty value syncs every lane.
        required: false

# The default GITHUB_TOKEN is read-only in many organizations.
# The sync pushes a branch and it opens a pull request.
# Both scopes must be explicit, or the first write fails with a 403.
permissions:
  contents: write
  pull-requests: write

concurrency:
  # Each trigger carries the lane identity in a different place.
  # The event name must come first in each pair.
  # `github.ref_name` also holds a value on a schedule run.
  group: >-
    bit-sync-${{
    github.event_name == 'repository_dispatch' && (github.event.client_payload.laneId || 'main-export')
    || github.event_name == 'push' && github.ref_name
    || github.event_name == 'workflow_dispatch' && (github.event.inputs.lane || 'reconcile-all')
    || 'reconcile-all' }}
  # A run can hold a pushed branch and an unfinished pull request.
  # Do not cancel it.
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The reconciler reads the full history. A shallow clone stops the run.
          fetch-depth: 0

      # Pin the job's node: the node 22.22+ that bvm bundles (and the runner
      # ships) breaks the pnpm ESM graph inside the bit bundle with a
      # "npm-run-path named export not found" crash during bit install of the
      # branch workspace. 22.14 is known good.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      # ---------------------------------------------------------------------
      # Branch-built bit. This is the ONLY difference from the stock example:
      # bit comes from the branch feat/ci-sync-partial-lane of
      # luvkapur/bit instead of the released install that bit-tasks/init does.
      # ---------------------------------------------------------------------
      - id: bit-branch
        name: Resolve the bit branch commit
        run: |
          SHA=$(git ls-remote https://github.com/luvkapur/bit refs/heads/feat/ci-sync-partial-lane | cut -f1)
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - id: bit-src-restore
        uses: actions/cache/restore@v4
        with:
          # ~/.bvm must travel with bit-src: `bit install` links some core
          # packages (e.g. @teambit/legacy) as symlinks into the bvm
          # installation, and a restored bit-src without ~/.bvm dangles.
          path: |
            ~/bit-src
            ~/.bvm
          key: bit-src-v3-${{ runner.os }}-${{ steps.bit-branch.outputs.sha }}
      - name: Build bit from the branch (cache miss only)
        if: steps.bit-src-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          node --version
          npm install --global @teambit/bvm
          bvm config set RELEASE_TYPE nightly
          bvm upgrade
          export PATH="$HOME/bin:$HOME/.bvm/bin:$PATH"
          # Run the bvm-installed bit under THIS job's pinned node, not the
          # node the bundle downloaded (see the setup-node comment above).
          BIT_APP=$(ls -d "$HOME"/.bvm/versions/*/bit-*/node_modules/@teambit/bit/dist/app.js | tail -1)
          printf '#!/bin/sh\nexec node "%s" "$@"\n' "$BIT_APP" > "$HOME/bin/bit"
          chmod +x "$HOME/bin/bit"
          # bvm resolves the bundle's deps fresh at install time, and the
          # current resolution ships a broken nested execa under
          # @pnpm/network.git-utils (npm-run-path named-export SyntaxError when
          # the linker reads injected dirs on a rootComponents workspace).
          # Give that subtree its own complete dependency set so module
          # resolution never escapes to a wrong hoisted copy.
          GU=$(ls -d "$HOME"/.bvm/versions/*/bit-*/node_modules/@pnpm/network.git-utils | tail -1)
          (cd "$GU" && npm install --omit=dev --no-package-lock --no-save --silent)
          node --version
          bit --version
          git clone --depth 1 -b feat/ci-sync-partial-lane https://github.com/luvkapur/bit "$HOME/bit-src"
          cd "$HOME/bit-src"
          bit install
          bit compile
          # First contact links the authored core aspects (e.g. @teambit/ci)
          # to the RUNNING bvm bit as a bootstrap bridge. Only an install that
          # runs after the compile repoints them at the workspace's own
          # compiled copies - without it, the released code keeps running.
          bit install
      # The save runs right after a successful build, before any sync step can
      # fail, so one green build is enough to fill the cache for every workflow.
      - uses: actions/cache/save@v4
        if: steps.bit-src-restore.outputs.cache-hit != 'true'
        with:
          # ~/.bvm must travel with bit-src: `bit install` links some core
          # packages (e.g. @teambit/legacy) as symlinks into the bvm
          # installation, and a restored bit-src without ~/.bvm dangles.
          path: |
            ~/bit-src
            ~/.bvm
          key: bit-src-v3-${{ runner.os }}-${{ steps.bit-branch.outputs.sha }}
      - name: Put the branch-built bit on the PATH
        run: |
          set -euo pipefail
          test -f "$HOME/bit-src/node_modules/@teambit/bit/dist/app.js"
          # -e follows symlinks: a dangling @teambit/legacy link (bvm dir
          # missing) must fail HERE, not later inside `bit install`.
          test -e "$HOME/bit-src/node_modules/@teambit/legacy"
          # The runtime must be the BRANCH code, not the bvm bootstrap bridge:
          # @teambit/ci must resolve inside bit-src and its compiled planner
          # must know the adopt-branch action (the fix under test).
          CIP=$(node -e "console.log(require('fs').realpathSync(process.env.HOME+'/bit-src/node_modules/@teambit/ci'))")
          echo "@teambit/ci realpath: $CIP"
          case "$CIP" in *.bvm*) echo '@teambit/ci still resolves into the bvm install'; exit 1;; esac
          grep -q adopt-branch "$HOME/bit-src/node_modules/@teambit/ci/dist/sync/sync-planner.js"
          sudo ln -sf "$HOME/bit-src/bin/bit.js" /usr/local/bin/bit
          command -v bit
          bit --version
      # ---------------------------------------------------------------------

      # The init step reads the token too. Without it, the step stops
      # with "BIT_CONFIG_ACCESS_TOKEN environment variable is not set!".
      - uses: bit-tasks/init@v2
        with:
          # bit is already on the PATH from the branch build above.
          skip-bit-install: 'true'
        env:
          BIT_CONFIG_ACCESS_TOKEN: ${{ secrets.BIT_CONFIG_ACCESS_TOKEN }}
      # The pin is deliberate, because this job holds write permission.
      - uses: teambit/bit-git-sync@66c0fdf9e34e45f70b4f397b38b2b01f79dd1f41
        env:
          # A bit.cloud service-account token. The account writes to your scope.
          BIT_CONFIG_ACCESS_TOKEN: ${{ secrets.BIT_CONFIG_ACCESS_TOKEN }}
          # GitHub credentials for the branch push and the pull request.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
