# Adopt: it turns an ordinary git pull request into a bit.cloud lane.
# This workflow is optional. Use it if your developers start work in git
# instead of on a lane.
name: bit-adopt-pr
on:
  pull_request:
    types: [opened, synchronize]

# The workflow pushes one commit to the pull request branch.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bit-adopt-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-latest
    # Three branches must not reach the adoption step:
    # a sync branch, because the action owns it;
    # a pull request from the bot, because the bot output is not new work;
    # a pull request from a fork, because the push back is not permitted.
    if: >-
      !startsWith(github.event.pull_request.head.ref, 'bit-sync/')
      && github.event.pull_request.user.login != 'github-actions[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the branch itself, not the merge commit.
          # The last step pushes to this branch.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      # ---------------------------------------------------------------------
      # Branch-built bit. This is the ONLY difference from the stock example:
      # bit comes from the branch fix/ci-pr-keep-lane-bitmap-pointer of
      # luvkapur/bit instead of the released install that bit-tasks/init does.
      # ---------------------------------------------------------------------
      - id: bit-branch
        name: Resolve the bit branch commit
        run: |
          SHA=$(git ls-remote https://github.com/luvkapur/bit refs/heads/fix/ci-pr-keep-lane-bitmap-pointer | cut -f1)
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - id: bit-src-restore
        uses: actions/cache/restore@v4
        with:
          # ~/.bvm must travel with bit-src: `bit install` links some core
          # packages (e.g. @teambit/legacy) as symlinks into the bvm
          # installation, and a restored bit-src without ~/.bvm dangles.
          path: |
            ~/bit-src
            ~/.bvm
          key: bit-src-v2-${{ runner.os }}-${{ steps.bit-branch.outputs.sha }}
      - name: Build bit from the branch (cache miss only)
        if: steps.bit-src-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          node --version
          npx @teambit/bvm install 2.0.69
          export PATH="$HOME/bin:$HOME/.bvm/bin:$PATH"
          bit --version
          git clone --depth 1 -b fix/ci-pr-keep-lane-bitmap-pointer https://github.com/luvkapur/bit "$HOME/bit-src"
          cd "$HOME/bit-src"
          bit install
          bit compile
      # The save runs right after a successful build, before any sync step can
      # fail, so one green build is enough to fill the cache for every workflow.
      - uses: actions/cache/save@v4
        if: steps.bit-src-restore.outputs.cache-hit != 'true'
        with:
          # ~/.bvm must travel with bit-src: `bit install` links some core
          # packages (e.g. @teambit/legacy) as symlinks into the bvm
          # installation, and a restored bit-src without ~/.bvm dangles.
          path: |
            ~/bit-src
            ~/.bvm
          key: bit-src-v2-${{ runner.os }}-${{ steps.bit-branch.outputs.sha }}
      - name: Put the branch-built bit on the PATH
        run: |
          set -euo pipefail
          test -f "$HOME/bit-src/node_modules/@teambit/bit/dist/app.js"
          # -e follows symlinks: a dangling @teambit/legacy link (bvm dir
          # missing) must fail HERE, not later inside `bit install`.
          test -e "$HOME/bit-src/node_modules/@teambit/legacy"
          sudo ln -sf "$HOME/bit-src/bin/bit.js" /usr/local/bin/bit
          command -v bit
          bit --version
      # ---------------------------------------------------------------------


      # The adoption must happen one time for each pull request.
      # A lane pointer in `.bitmap` is the evidence of an earlier adoption.
      - id: guard
        name: Look for an existing lane pointer
        run: |
          if [ -f .bitmap ] && grep -q '"_bit_lane"' .bitmap; then
            echo 'This pull request has a lane already. The job stops here.'
            echo 'adopted=true' >> "$GITHUB_OUTPUT"
          else
            echo 'adopted=false' >> "$GITHUB_OUTPUT"
          fi

      # The init step reads the token too. Without it, the step stops
      # with "BIT_CONFIG_ACCESS_TOKEN environment variable is not set!".
      - if: steps.guard.outputs.adopted == 'false'
        uses: bit-tasks/init@v2
        with:
          # bit is already on the PATH from the branch build above.
          skip-bit-install: 'true'
        env:
          BIT_CONFIG_ACCESS_TOKEN: ${{ secrets.BIT_CONFIG_ACCESS_TOKEN }}

      # The reconcile workflow uses
      # teambit/bit-git-sync@66c0fdf9e34e45f70b4f397b38b2b01f79dd1f41.
      # This job calls the command instead, because the action routes a merged
      # pull request only.
      - if: steps.guard.outputs.adopted == 'false'
        name: Create the lane from the pull request
        run: |
          bit install
          bit ci pr --keep-lane
        env:
          BIT_CONFIG_ACCESS_TOKEN: ${{ secrets.BIT_CONFIG_ACCESS_TOKEN }}

      - if: steps.guard.outputs.adopted == 'false'
        name: Push the lane pointer back to the branch
        run: |
          if [ -z "$(git status --porcelain .bitmap)" ]; then
            echo 'The command changed no lane pointer. There is nothing to push.'
            exit 0
          fi
          git config user.name 'bit-sync[bot]'
          git config user.email 'bit-sync[bot]@users.noreply.github.com'
          git add .bitmap
          git commit -m 'chore(bit-sync): adopt this pull request into a lane'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
